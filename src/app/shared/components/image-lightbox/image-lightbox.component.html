<div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
  @for (image of images(); track image.id; let index = $index) {
    <div [class]="index === 0 || index === 5 ? 'sm:row-span-2' : ''" data-testid="gallery-item">
      <app-dish-card [image]="image" (selected)="open(index)" />
    </div>
  }
</div>

@if (selectedImage(); as image) {
  <div
    class="fixed inset-0 z-[90] grid place-items-center bg-oasis-950/95 p-4 backdrop-blur-lg sm:p-8"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="image.caption"
    data-testid="lightbox"
  >
    <button
      type="button"
      class="absolute inset-0 size-full cursor-default"
      aria-label="Fermer la galerie"
      (click)="close()"
    ></button>
    <button
      type="button"
      class="absolute right-4 top-4 z-10 grid size-12 place-items-center rounded-full bg-white/10 text-white transition hover:bg-mango-500 sm:right-8 sm:top-8"
      aria-label="Fermer la galerie"
      data-testid="lightbox-close"
      (click)="close()"
    >
      <svg lucideX aria-hidden="true" class="size-6"></svg>
    </button>

    <button
      type="button"
      class="absolute left-3 top-1/2 z-10 grid size-12 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white transition hover:bg-mango-500 sm:left-8"
      aria-label="Image précédente"
      (click)="$event.stopPropagation(); previous()"
    >
      <svg lucideChevronLeft aria-hidden="true" class="size-7"></svg>
    </button>

    <figure
      class="relative flex max-h-[88vh] max-w-5xl flex-col items-center"
    >
      <img
        [ngSrc]="image.src"
        [width]="image.width"
        [height]="image.height"
        [alt]="image.alt"
        class="max-h-[78vh] w-auto rounded-3xl object-contain shadow-2xl"
      />
      <figcaption class="mt-4 text-center font-display text-xl font-bold text-white">
        {{ image.caption }}
      </figcaption>
    </figure>

    <button
      type="button"
      class="absolute right-3 top-1/2 z-10 grid size-12 -translate-y-1/2 place-items-center rounded-full bg-white/10 text-white transition hover:bg-mango-500 sm:right-8"
      aria-label="Image suivante"
      (click)="$event.stopPropagation(); next()"
    >
      <svg lucideChevronRight aria-hidden="true" class="size-7"></svg>
    </button>
  </div>
}

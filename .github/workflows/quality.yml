name: Qualité frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le lint
        run: npm run lint

      - name: Exécuter les tests Vitest
        run: npm run test -- --run

      - name: Construire le site statique
        run: npm run build

      - name: Conserver le build vérifié
        uses: actions/upload-artifact@v4
        with:
          name: espace-oasis-static
          path: dist/espace-oasis/browser
          if-no-files-found: error
          retention-days: 7
